[project]
name = "shensec"
version = "0.1.0"
description = "A Python Package for Web Security Auditing and Result Analysis"
authors = [
    { name = "Developer" }
]
readme = "README.md"
requires-python = ">=3.13"
keywords = ["security", "audit", "scanner", "jwt", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "typer>=0.24.1",
]

[project.scripts]
shensec = "shensec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shensec"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.2",
]
