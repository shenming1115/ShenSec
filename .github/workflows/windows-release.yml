name: Windows executable

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['packaging/**', 'scripts/**', 'src/**', 'pyproject.toml', 'uv.lock', '.github/workflows/windows-release.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked application and build dependencies
        run: uv sync --locked --extra gui --group build --python 3.13.3
      - name: Run tests
        run: uv run --locked pytest -q
      - name: Build Windows x64 distributions
        run: uv run --locked --group build python scripts/build_windows.py
      - name: Verify bundled runtime outside the source tree
        shell: pwsh
        run: |
          $repoRoot = $PWD.Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONPATH = ''
          $env:PYTHONHOME = ''
          $env:SHENSEC_HOME = Join-Path $env:RUNNER_TEMP 'isolated-shensec-home'
          Set-Location $env:RUNNER_TEMP
          $executables = @((Join-Path $repoRoot 'dist\ShenSec\ShenSec.exe')) + @(Get-ChildItem (Join-Path $repoRoot 'dist\ShenSec-*-windows-x64.exe') | ForEach-Object FullName)
          foreach ($exePath in $executables) {
            $checkDir = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($exePath) + '-verification')
            $process = Start-Process -FilePath $exePath -ArgumentList @('--self-test', "`"$checkDir`"") -WindowStyle Hidden -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "Packaged runtime failed: $exePath" }
            $result = Get-Content (Join-Path $checkDir 'result.json') | ConvertFrom-Json
            if (!$result.frozen -or $result.gate -ne 'passed' -or $result.permissions -ne 8 -or $result.renewals -ne 4) { throw 'Incorrect packaged verification result' }
            Copy-Item $checkDir (Join-Path $repoRoot ('build\verification-' + [IO.Path]::GetFileNameWithoutExtension($exePath))) -Recurse
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ShenSec-windows-x64
          path: |
            dist/ShenSec-*.exe
            dist/ShenSec-*.zip
            dist/SHA256SUMS.txt
            build/verification-*/
      - name: Publish tagged beta release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseAssets = @(Get-ChildItem dist/ShenSec-*.exe, dist/ShenSec-*.zip, dist/SHA256SUMS.txt | ForEach-Object FullName)
          $notesPath = "docs/releases/$env:GITHUB_REF_NAME.md"
          $notesArgs = if (Test-Path $notesPath) { @('--notes-file', $notesPath) } else { @('--generate-notes') }
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; do not replace verified artifacts automatically.' }
          gh release create $env:GITHUB_REF_NAME @releaseAssets --verify-tag --prerelease --title "ShenSec $env:GITHUB_REF_NAME · Windows desktop beta" @notesArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
