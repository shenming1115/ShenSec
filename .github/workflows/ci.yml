name: Tests and package build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked --extra gui
      - run: uv run --locked pytest
      - run: uv run --locked python -c "import shensec; import shensec.gui.app; print(shensec.__version__)"
      - run: uv run --locked shensec --help
      - run: uv build
