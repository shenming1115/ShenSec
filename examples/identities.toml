[["roles"]]
"name" = "anonymous"
"anonymous" = true

["roles"."auth"]
"profile" = "default"
"required" = false
"origins" = []
"allow_http" = false
"verify_status" = 200

[["permissions"]]
"id" = "admin_only"
"title" = "Admin dashboard"
"url" = "https://staging.example.com/api/admin"
"method" = "GET"
"allow_status" = [200]
"deny_status" = [401, 403]
"json_pointer" = "/resource"
"json_value" = "admin-dashboard"

["permissions"."expectations"]
"admin" = "allow"
"owner" = "deny"
"other" = "deny"
"anonymous" = "deny"

[["permissions"]]
"id" = "record_owner"
"title" = "Record 42 ownership"
"url" = "https://staging.example.com/api/records/42"
"method" = "GET"
"allow_status" = [200]
"deny_status" = [401, 403]
"json_pointer" = "/record/id"
"json_value" = 42

["permissions"."expectations"]
"admin" = "allow"
"owner" = "allow"
"other" = "deny"
"anonymous" = "deny"
