[project]
name = "shensec"
version = "0.2.0"
description = "Defensive HTTP configuration auditing and local JWT inspection with CLI, API, and optional GUI"
authors = [
    { name = "Ch'ng Shen Ming" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["security", "http", "security-headers", "cookies", "cors", "jwt", "audit", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "typer>=0.24.1",
]

[project.optional-dependencies]
gui = [
    "pyqtdarktheme[pyside6]>=2.1.0",
    "pyside6>=6.11.0",
]

[project.urls]
Homepage = "https://github.com/shenming1115/ShenSec"
Repository = "https://github.com/shenming1115/ShenSec"
Issues = "https://github.com/shenming1115/ShenSec/issues"

[project.scripts]
shensec = "shensec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shensec"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

